name: Release Mobile App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target Mobile Platform'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios

permissions:
  contents: write

jobs:
  build-mobile:
    name: Build Mobile (Android & iOS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Expo / EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Export Mobile App Bundle
        working-directory: apps/mobile
        run: |
          pnpm exec expo export --platform all --output-dir dist

      - name: Create Mobile Bundle Archive
        run: |
          cd apps/mobile
          tar -czvf kivo-mobile-bundle.tar.gz dist/

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            apps/mobile/kivo-mobile-bundle.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
